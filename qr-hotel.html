<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Dejar opinión - Grupo Murillo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, #1a2a4f 0%, #0f1a33 100%);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            padding: 24px 20px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            backdrop-filter: blur(2px);
        }

        h1 {
            background: linear-gradient(135deg, #1a2a4f 0%, #2d4a7a 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .subtitulo {
            color: #6c7a91;
            font-size: 13px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eef2f7;
            display: inline-block;
            padding-bottom: 6px;
        }

        .trabajador {
            background: linear-gradient(135deg, #f0f4ff 0%, #e8edf9 100%);
            padding: 16px;
            border-radius: 24px;
            margin: 20px 0;
            font-size: 20px;
            font-weight: 700;
            color: #1a2a4f;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.6);
        }

        .idioma-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .idioma-selector button {
            padding: 6px 20px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            background: #f0f2f5;
            color: #4a5568;
        }

        .idioma-selector button.active {
            background: #1a2a4f;
            color: white;
            box-shadow: 0 4px 12px rgba(26, 42, 79, 0.3);
        }

        .seccion-hoteles {
            margin: 20px 0;
        }

        .titulo-seccion {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a2a4f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .hoteles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .hotel-card {
            background: white;
            border: 1px solid #e9edf2;
            border-radius: 20px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .hotel-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -10px rgba(0,0,0,0.15);
            border-color: #cbd5e1;
        }

        .hotel-card.seleccionado {
            border-color: #1a2a4f;
            background: #f8fafd;
            box-shadow: 0 8px 20px -8px rgba(26, 42, 79, 0.25);
            transform: scale(1.01);
        }

        .hotel-imagen {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 10px;
            background: #f1f5f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .hotel-nombre {
            font-weight: 600;
            color: #1e293b;
            font-size: 13px;
            line-height: 1.3;
        }

        .seccion-plataformas {
            display: none;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 2px solid #eef2f7;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .aviso-copiar {
            background: #eef2ff;
            padding: 14px 16px;
            border-radius: 20px;
            margin: 16px 0;
            font-size: 14px;
            color: #1e3a8a;
            border-left: 5px solid #1a2a4f;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .aviso-copiar span {
            font-size: 24px;
        }

        .texto-copiar {
            background: #f8fafc;
            padding: 14px;
            border-radius: 20px;
            margin: 12px 0;
            font-size: 16px;
            cursor: pointer;
            word-break: break-word;
            font-weight: 600;
            color: #1a2a4f;
            border: 1px dashed #cbd5e1;
            transition: all 0.2s;
        }

        .texto-copiar:active {
            background: #eef2ff;
        }

        .boton-copiar {
            background: linear-gradient(135deg, #1a2a4f 0%, #2d4a7a 100%);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px 0 12px;
            transition: all 0.2s;
            width: 100%;
            box-shadow: 0 6px 14px rgba(26, 42, 79, 0.25);
        }

        .boton-copiar:active {
            transform: scale(0.97);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .plataformas-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 18px 0;
        }

        .boton-plataforma {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border: 1px solid #e9edf2;
        }

        .boton-plataforma:active {
            transform: scale(0.98);
        }

        .google { border-left: 5px solid #4285F4; }
        .booking { border-left: 5px solid #003580; }
        .tripadvisor { border-left: 5px solid #00A680; }
        .expedia { border-left: 5px solid #FF6600; }

        .boton-reiniciar {
            background: none;
            color: #6c7a91;
            padding: 10px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
        }

        .boton-reiniciar:active {
            background: #f1f5f9;
        }

        footer {
            margin-top: 24px;
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2a4f;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .toast.mostrar {
            opacity: 1;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .aviso-copiar {
            animation: pulse 0.6s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Grupo Murillo ✨</h1>
    <div class="subtitulo" id="subtitulo">hoteles con encanto en Sevilla</div>
    
    <div class="idioma-selector">
        <button id="btnEs" class="active">🇪🇸 ESP</button>
        <button id="btnEn">🇬🇧 ENG</button>
    </div>

    <div class="trabajador" id="trabajadorDiv">
        👩 <span id="atendidoTexto">Atendida por:</span> <strong id="nombreTrabajador">CARGANDO...</strong>
    </div>

    <div class="seccion-hoteles">
        <div class="titulo-seccion" id="tituloHoteles">
            🏨 Selecciona tu hotel
        </div>
        <div class="hoteles-grid" id="hotelesGrid"></div>
    </div>

    <div class="seccion-plataformas" id="seccionPlataformas">
        <div class="titulo-seccion" id="tituloPlataformas">🌐 ¿Dónde dejar tu opinión?</div>
        
        <!-- Aviso que aparece automáticamente al abrir tras elegir hotel -->
        <div class="aviso-copiar" id="avisoCopiar">
            <span>📋</span> <span id="avisoTexto">¡Copia el nombre antes de escribir tu reseña!</span>
        </div>

        <div class="texto-copiar" id="textoParaCopiar">CARGANDO...</div>
        <button class="boton-copiar" id="btnCopiar">
            📋 <span id="btnCopiarTexto">Copiar nombre</span>
        </button>

        <div class="plataformas-grid">
            <button class="boton-plataforma google" id="btnGoogle">
                <span>⭐</span> Google
            </button>
            <button class="boton-plataforma booking" id="btnBooking">
                <span>🏨</span> Booking.com
            </button>
            <button class="boton-plataforma tripadvisor" id="btnTripadvisor">
                <span>🗺️</span> TripAdvisor
            </button>
            <button class="boton-plataforma expedia" id="btnExpedia">
                <span>✈️</span> Expedia
            </button>
        </div>
        
        <button class="boton-reiniciar" id="btnReiniciar">← Cambiar de hotel</button>
    </div>

    <footer>1️⃣ Elige hotel | 2️⃣ Copia el nombre | 3️⃣ Elige plataforma y pega</footer>
</div>

<div id="toast" class="toast">✅ Nombre copiado</div>

<script>
    // ========================
    // LISTA DE 5 HOTELES
    // ========================
    const hoteles = [
        {
            id: 1,
            nombre: "Hotel Murillo",
            nombreEn: "Hotel Murillo",
            imagen: "https://cf.bstatic.com/xdata/images/hotel/max1024x768/348442875.jpg?k=c694a14eec559dd8ea96b5913dfb540522442bed4d7173542af7251be2c453fc&o=",
            urlGoogle: "https://www.google.es/travel/hotels/entity/ChgI86CK3Oe71qNTGgwvZy8xaGh2cG54NnMQAQ/reviews",
            urlBooking: "https://www.booking.com/hotel/es/murillo.es.html",
            busqueda: "Hotel Murillo Sevilla"
        },
        {
            id: 2,
            nombre: "Hotel Murillo Reinoso",
            nombreEn: "Hotel Murillo Reinoso",
            imagen: "https://cf.bstatic.com/xdata/images/hotel/max1024x768/692135323.jpg?k=84d540cf7703f677a2df34660299d1ed86a02d3135ad795475e4b839ddc3ad2b&o=",
            urlGoogle: "https://www.google.com/travel/search?q=hotel%20murillo%20reinoso&gsas=1&ts=CAESCAoCCAMKAggDKgcKBToDRVVS&qs=CAAgACgA&ap=MAC6AQdyZXZpZXdz",
            urlBooking: "https://www.booking.com/hotel/es/hotel-murilloreinoso.es.html",
            busqueda: "Hotel Murillo Reinoso Sevilla"
        },
        {
            id: 3,
            nombre: "Suite Murillo Plaza Santa Cruz",
            nombreEn: "Suite Murillo Plaza Santa Cruz",
            imagen: "https://cf.bstatic.com/xdata/images/hotel/max1024x768/210039527.jpg?k=b667eeadb6ad0622486b1357a768a63f70f4cfe345c656ce497c5dbed8ab8e28&o=",
            urlGoogle: "https://www.google.com/travel/search?gsas=1&ts=EggKAggDCgIIAxocEhoSFAoHCOoPEAkYAxIHCOoPEAkYBBgBMgIQAA&qs=MhNDZ29Jd2JUX3dvSEpwTzlURUFFOAI&ap=ugEHcmV2aWV3cw",
            urlBooking: "https://www.booking.com/hotel/es/suites-murillo-plaza-sta-cruz.es.html",
            busqueda: "Suite Murillo Plaza Santa Cruz Sevilla"
        },
        {
            id: 4,
            nombre: "Suites Murillo Alcázar",
            nombreEn: "Suites Murillo Alcázar",
            imagen: "https://cf.bstatic.com/xdata/images/hotel/max1024x768/14276672.jpg?k=22cca70c388f39711ef0688d25c12a1058234ad094d7c0e247519b1357fd8e6a&o=",
            urlGoogle: "https://www.google.com/travel/search?q=suites%20murillo%20alc%C3%A1zar%20sevilla&gsas=1&ts=CAESCAoCCAMKAggDKgcKBToDRVVS&qs=CAAgASgAMidDaGtJNHJIN2xjWE1oLXFOQVJvTUwyY3ZNWEJ3TW5nMVoyZzVFQUU&ap=MAC6AQdyZXZpZXdz",
            urlBooking: "https://www.booking.com/hotel/es/suites-murillo.es.html",
            busqueda: "Suites Murillo Alcázar Sevilla"
        },
        {
            id: 5,
            nombre: "Suites Murillo Catedral",
            nombreEn: "Suites Murillo Catedral",
            imagen: "https://cf.bstatic.com/xdata/images/hotel/max1024x768/692135323.jpg?k=84d540cf7703f677a2df34660299d1ed86a02d3135ad795475e4b839ddc3ad2b&o=",
            urlGoogle: "https://www.google.com/travel/search?q=suites%20murillo%20catedral&gsas=1&ts=CAESCAoCCAMKAggDKgcKBToDRVVS&qs=CAAgASgAMidDaGtJaHRxWXRaT1I4czByR2cwdlp5OHhNV016ZGpab2MyMHdFQUU&ap=MAC6AQdyZXZpZXdz",
            urlBooking: "https://www.booking.com/hotel/es/suites-murillo-segovias.es.html",
            busqueda: "Suites Murillo Catedral Sevilla"
        }
    ];

    // ========================
    // DETECTAR IDIOMA DEL DISPOSITIVO
    // ========================
    function detectarIdiomaDispositivo() {
        const idiomaNavegador = navigator.language || navigator.userLanguage;
        if (idiomaNavegador.startsWith('es')) return 'es';
        if (idiomaNavegador.startsWith('en')) return 'en';
        return 'es'; // Por defecto español
    }

    function obtenerParametrosURL() {
        const urlParams = new URLSearchParams(window.location.search);
        let trabajador = urlParams.get('trabajador');
        let idiomaUrl = urlParams.get('idioma');
        
        let nombreTrabajador = 'María José';
        if (trabajador && trabajador !== 'Trabajador' && trabajador !== 'null') {
            nombreTrabajador = decodeURIComponent(trabajador);
        }
        
        // Prioridad: 1° URL, 2° dispositivo, 3° español
        let idiomaFinal = idiomaUrl ? idiomaUrl : detectarIdiomaDispositivo();
        
        return {
            trabajador: nombreTrabajador,
            idioma: idiomaFinal
        };
    }

    const datos = obtenerParametrosURL();
    let idiomaActual = datos.idioma;
    let hotelSeleccionado = null;
    let avisoMostrado = false;

    document.getElementById('nombreTrabajador').innerText = datos.trabajador;

    // ========================
    // TEXTOS EN DOS IDIOMAS
    // ========================
    const textos = {
        es: {
            subtitulo: "hoteles con encanto en Sevilla",
            atendido: "Atendida por:",
            tituloHoteles: "🏨 Selecciona tu hotel",
            tituloPlataformas: "🌐 ¿Dónde dejar tu opinión?",
            aviso: `📋 ¡Copia el nombre de ${datos.trabajador} antes de escribir tu reseña!`,
            copiarBoton: "Copiar nombre",
            textoParaCopiar: `Atendida por ${datos.trabajador}: `,
            google: "Google",
            booking: "Booking.com",
            tripadvisor: "TripAdvisor",
            expedia: "Expedia",
            footer: "1️⃣ Elige hotel | 2️⃣ Copia el nombre | 3️⃣ Elige plataforma y pega",
            cambiarHotel: "← Cambiar de hotel",
            toast: "✅ Nombre copiado",
            sinHotel: "Primero elige un hotel"
        },
        en: {
            subtitulo: "charming hotels in Seville",
            atendido: "Served by:",
            tituloHoteles: "🏨 Select your hotel",
            tituloPlataformas: "🌐 Where to leave your review?",
            aviso: `📋 Copy ${datos.trabajador}'s name before writing your review!`,
            copiarBoton: "Copy name",
            textoParaCopiar: `Served by ${datos.trabajador}: `,
            google: "Google",
            booking: "Booking.com",
            tripadvisor: "TripAdvisor",
            expedia: "Expedia",
            footer: "1️⃣ Choose hotel | 2️⃣ Copy name | 3️⃣ Choose platform and paste",
            cambiarHotel: "← Change hotel",
            toast: "✅ Name copied",
            sinHotel: "First select a hotel"
        }
    };

    function obtenerTextoCompleto() {
        if (idiomaActual === 'es') {
            return `Atendida por ${datos.trabajador}: `;
        } else {
            return `Served by ${datos.trabajador}: `;
        }
    }

    function actualizarTextos() {
        const t = textos[idiomaActual];
        document.getElementById('subtitulo').innerText = t.subtitulo;
        document.getElementById('atendidoTexto').innerText = t.atendido;
        document.getElementById('tituloHoteles').innerHTML = t.tituloHoteles;
        document.getElementById('tituloPlataformas').innerHTML = t.tituloPlataformas;
        document.getElementById('avisoTexto').innerText = t.aviso;
        document.getElementById('btnCopiarTexto').innerText = t.copiarBoton;
        document.getElementById('textoParaCopiar').innerText = obtenerTextoCompleto();
        document.getElementById('btnGoogle').innerHTML = `<span>⭐</span> ${t.google}`;
        document.getElementById('btnBooking').innerHTML = `<span>🏨</span> ${t.booking}`;
        document.getElementById('btnTripadvisor').innerHTML = `<span>🗺️</span> ${t.tripadvisor}`;
        document.getElementById('btnExpedia').innerHTML = `<span>✈️</span> ${t.expedia}`;
        document.getElementById('footer').innerHTML = t.footer;
        document.getElementById('btnReiniciar').innerHTML = t.cambiarHotel;
        
        // Marcar botón activo
        if (idiomaActual === 'es') {
            document.getElementById('btnEs').classList.add('active');
            document.getElementById('btnEn').classList.remove('active');
        } else {
            document.getElementById('btnEn').classList.add('active');
            document.getElementById('btnEs').classList.remove('active');
        }
        
        document.querySelectorAll('.hotel-card').forEach(card => {
            const hotelId = parseInt(card.dataset.id);
            const hotel = hoteles.find(h => h.id === hotelId);
            if (hotel) {
                const nombreElem = card.querySelector('.hotel-nombre');
                if (nombreElem) {
                    nombreElem.innerText = idiomaActual === 'es' ? hotel.nombre : hotel.nombreEn;
                }
            }
        });
    }

    function cargarHoteles() {
        const grid = document.getElementById('hotelesGrid');
        grid.innerHTML = '';
        
        hoteles.forEach(hotel => {
            const card = document.createElement('div');
            card.className = 'hotel-card';
            card.dataset.id = hotel.id;
            
            card.innerHTML = `
                <img class="hotel-imagen" src="${hotel.imagen}" alt="${hotel.nombre}" 
                     onerror="this.src='https://placehold.co/400x300/cccccc/white?text=Hotel'">
                <div class="hotel-nombre">${idiomaActual === 'es' ? hotel.nombre : hotel.nombreEn}</div>
            `;
            
            card.onclick = () => seleccionarHotel(hotel);
            grid.appendChild(card);
        });
    }

    function seleccionarHotel(hotel) {
        hotelSeleccionado = hotel;
        
        document.querySelectorAll('.hotel-card').forEach(card => {
            card.classList.remove('seleccionado');
            if (parseInt(card.dataset.id) === hotel.id) {
                card.classList.add('seleccionado');
            }
        });
        
        document.getElementById('textoParaCopiar').innerText = obtenerTextoCompleto();
        document.getElementById('seccionPlataformas').style.display = 'block';
        document.getElementById('seccionPlataformas').scrollIntoView({ behavior: 'smooth' });
    }

    function mostrarToast() {
        const toast = document.getElementById('toast');
        toast.innerText = textos[idiomaActual].toast;
        toast.classList.add('mostrar');
        setTimeout(() => {
            toast.classList.remove('mostrar');
        }, 2000);
    }

    function copiarTexto() {
        if (!hotelSeleccionado) {
            alert(textos[idiomaActual].sinHotel);
            return;
        }
        const texto = obtenerTextoCompleto();
        navigator.clipboard.writeText(texto).then(() => {
            mostrarToast();
        }).catch(() => {
            alert(idiomaActual === 'es' ? 'No se pudo copiar' : 'Could not copy');
        });
    }

    document.getElementById('btnCopiar').onclick = copiarTexto;
    document.getElementById('textoParaCopiar').onclick = copiarTexto;

    function abrirPlataforma(plataforma) {
        if (!hotelSeleccionado) {
            alert(textos[idiomaActual].sinHotel);
            return;
        }
        
        let url = '';
        switch(plataforma) {
            case 'google':
                url = hotelSeleccionado.urlGoogle;
                break;
            case 'booking':
                url = hotelSeleccionado.urlBooking;
                break;
            case 'tripadvisor':
                url = `https://www.tripadvisor.com/Search?q=${encodeURIComponent(hotelSeleccionado.busqueda)}`;
                break;
            case 'expedia':
                url = `https://www.expedia.com/Hotel-Search?destination=${encodeURIComponent(hotelSeleccionado.busqueda)}`;
                break;
        }
        window.open(url, '_blank');
    }
    
    document.getElementById('btnGoogle').onclick = () => abrirPlataforma('google');
    document.getElementById('btnBooking').onclick = () => abrirPlataforma('booking');
    document.getElementById('btnTripadvisor').onclick = () => abrirPlataforma('tripadvisor');
    document.getElementById('btnExpedia').onclick = () => abrirPlataforma('expedia');
    
    document.getElementById('btnReiniciar').onclick = () => {
        hotelSeleccionado = null;
        document.getElementById('seccionPlataformas').style.display = 'none';
        document.querySelectorAll('.hotel-card').forEach(card => {
            card.classList.remove('seleccionado');
        });
        document.getElementById('hotelesGrid').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('btnEs').onclick = () => { 
        idiomaActual = 'es'; 
        actualizarTextos();
        cargarHoteles();
        if (hotelSeleccionado) {
            document.getElementById('textoParaCopiar').innerText = obtenerTextoCompleto();
        }
    };
    
    document.getElementById('btnEn').onclick = () => { 
        idiomaActual = 'en'; 
        actualizarTextos();
        cargarHoteles();
        if (hotelSeleccionado) {
            document.getElementById('textoParaCopiar').innerText = obtenerTextoCompleto();
        }
    };
    
    cargarHoteles();
    actualizarTextos();
</script>

</body>
</html>
